<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>《弹壳特攻队攻略助手》小程序登录页 UI 原型</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans SC', sans-serif; }
    .game-font { font-family: 'Teko', sans-serif; }
    .game-gradient { background: linear-gradient(135deg, #15803D 0%, #22C55E 50%, #16A34A 100%); }
    .game-card-bg { background: rgba(30, 41, 59, 0.85); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 flex justify-center items-center">

  <!-- 微信小程序 Canvas 容器 (375px x 812px) -->
  <div class="w-[375px] h-[812px] bg-slate-900 rounded-[44px] border-8 border-slate-800 shadow-2xl overflow-hidden flex flex-col relative">
    
    <!-- 1. 微信小程序顶部状态栏 & 胶囊控制区 -->
    <div class="px-6 pt-3 pb-2 flex justify-between items-center z-10">
      <span class="text-xs text-slate-400 font-medium">9:41</span>
      <!-- 微信胶囊按钮样式 -->
      <div class="w-20 h-7 bg-slate-800/80 border border-slate-700/60 rounded-full flex items-center justify-between px-2.5">
        <span class="text-slate-300 text-xs">•••</span>
        <span class="text-slate-600 text-xs">|</span>
        <span class="w-3.5 h-3.5 border-2 border-slate-300 rounded-full inline-block"></span>
      </div>
    </div>

    <!-- 2. 游戏战术背景背景光效 -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-72 h-72 bg-emerald-500/15 blur-[90px] rounded-full pointer-events-none"></div>
    <div class="absolute top-48 -left-20 w-60 h-60 bg-amber-500/10 blur-[80px] rounded-full pointer-events-none"></div>

    <!-- 3. 内容滚动区 -->
    <div class="flex-1 overflow-y-auto px-6 pt-4 pb-6 flex flex-col justify-between z-10">
      
      <!-- Top Brand Logo Section -->
      <div class="text-center mt-4">
        <!-- 弹壳风格图标 -->
        <div class="w-20 h-20 mx-auto mb-3 rounded-2xl bg-gradient-to-tr from-emerald-600 to-amber-400 p-0.5 shadow-lg shadow-emerald-500/20">
          <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center relative overflow-hidden">
            <span class="text-3xl">💣</span>
            <div class="absolute -bottom-1 -right-1 bg-amber-500 text-slate-950 text-[9px] font-black px-1.5 py-0.5 rounded-tl-md">
              S级
            </div>
          </div>
        </div>
        <h1 class="text-2xl font-black tracking-wide text-white flex items-center justify-center gap-1.5">
          <span>弹壳特攻队</span>
          <span class="text-xs font-bold text-amber-400 bg-amber-400/10 border border-amber-400/30 px-2 py-0.5 rounded-md">攻略站</span>
        </h1>
        <p class="text-xs text-slate-400 mt-1">SURVIVOR.IO STRATEGY HUB</p>
      </div>

      <!-- Center Feature Preview Cards -->
      <div class="space-y-3 my-6">
        <div class="game-card-bg border border-emerald-500/30 p-3.5 rounded-2xl shadow-md flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-lg flex-shrink-0">
            ⚔️
          </div>
          <div>
            <div class="text-xs font-bold text-slate-200">100+ 章节通关神级搭配</div>
            <div class="text-[11px] text-slate-400 mt-0.5">追光者 / 毁灭者技能超强合成公式</div>
          </div>
        </div>

        <div class="game-card-bg border border-amber-500/30 p-3.5 rounded-2xl shadow-md flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center text-lg flex-shrink-0">
            🎁
          </div>
          <div>
            <div class="text-xs font-bold text-slate-200">最新通用兑换码实时更新</div>
            <div class="text-[11px] text-slate-400 mt-0.5">一键复制礼包码 免费领钻石体力</div>
          </div>
        </div>
      </div>

      <!-- Bottom Login Buttons & Agreement -->
      <div class="space-y-3">
        
        <!-- 微信一键登录主按钮 -->
        <button class="w-full py-3.5 game-gradient text-slate-950 font-black text-sm rounded-2xl shadow-lg shadow-emerald-500/25 flex items-center justify-center gap-2 transition hover:opacity-95 active:scale-[0.98]">
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
            <path d="M8.5 13.5c-4.1 0-7.5 2.7-7.5 6 0 1.9 1.1 3.6 2.8 4.7l-.7 2.2 2.6-1.3c.9.3 1.8.4 2.8.4 4.1 0 7.5-2.7 7.5-6s-3.4-6-7.5-6zm10-8.5c-4.7 0-8.5 3.1-8.5 7 0 .5.1.9.2 1.4 3.7.3 6.8 2.6 7.6 5.8 3.7-.4 6.7-3.1 6.7-7.2 0-3.9-3.8-7-8.5-7z"/>
          </svg>
          微信一键快捷登录
        </button>

        <!-- 手机号登录备用按钮 -->
        <button class="w-full py-3 bg-slate-800/80 border border-slate-700 text-slate-300 font-medium text-xs rounded-2xl hover:bg-slate-800 transition">
          手机号验证码登录
        </button>

        <!-- 游客先逛逛按钮 -->
        <div class="text-center pt-1">
          <button class="text-xs text-slate-500 hover:text-slate-400 underline decoration-slate-700">
            暂不登录，先看攻略 →
          </button>
        </div>

        <!-- 底部协议勾选 -->
        <div class="flex items-center justify-center gap-1.5 pt-2 text-[10px] text-slate-500">
          <input type="checkbox" id="agree" checked class="w-3 h-3 accent-emerald-500 rounded bg-slate-800 border-slate-700">
          <label for="agree">已阅读并同意 <span class="text-slate-400 underline">玩家服务协议</span> 与 <span class="text-slate-400 underline">隐私政策</span></label>
        </div>

      </div>

    </div>

  </div>

</body>
</html>
