<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figma AI 原型模版 - 智能农业管理 Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 flex justify-center items-center">

  <!-- Mobile Frame Prototype Container (375x812) -->
  <div class="w-[375px] h-[812px] bg-slate-900 rounded-[40px] border-8 border-slate-800 shadow-2xl overflow-hidden flex flex-col relative">
    
    <!-- Top Status Bar Placeholder -->
    <div class="px-6 pt-4 pb-2 flex justify-between items-center text-xs text-slate-400">
      <span>9:41</span>
      <div class="flex gap-1.5 items-center">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
        <span>5G</span>
      </div>
    </div>

    <!-- Header Section -->
    <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center">
      <div>
        <h1 class="text-lg font-bold text-white flex items-center gap-2">
          🌾 神农帮 AI
          <span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full font-normal">v4.0</span>
        </h1>
        <p class="text-xs text-slate-400">数字农场实时监控看板</p>
      </div>
      <div class="w-9 h-9 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-sm font-semibold text-emerald-400">
        淘
      </div>
    </div>

    <!-- Scrollable Content Area -->
    <div class="flex-1 overflow-y-auto p-6 space-y-5">
      
      <!-- Quick Metrics Grid -->
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-slate-800/60 border border-slate-700/50 p-3.5 rounded-2xl">
          <span class="text-xs text-slate-400">土壤湿润度</span>
          <div class="text-xl font-bold text-emerald-400 mt-1">68.5%</div>
          <span class="text-[10px] text-emerald-500/80">↑ 正常状态</span>
        </div>
        <div class="bg-slate-800/60 border border-slate-700/50 p-3.5 rounded-2xl">
          <span class="text-xs text-slate-400">环境温度</span>
          <div class="text-xl font-bold text-amber-400 mt-1">24.2°C</div>
          <span class="text-[10px] text-slate-400">光照充足</span>
        </div>
      </div>

      <!-- AI Real-time Insight Card -->
      <div class="bg-gradient-to-br from-emerald-900/30 to-slate-800/80 border border-emerald-500/30 p-4 rounded-2xl shadow-lg">
        <div class="flex items-center gap-2 text-xs font-semibold text-emerald-400 mb-2">
          <span>✨ AI 智能诊断建议</span>
        </div>
        <p class="text-xs text-slate-300 leading-relaxed">
          检测到 A2 区块气象湿润度下降 12%，建议在今晚 18:00 启动智能微喷灌系统，预计节约用能 15%。
        </p>
        <button class="mt-3 w-full py-2 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold text-xs rounded-xl transition">
          一键执行灌溉任务
        </button>
      </div>

      <!-- Parcel Management List -->
      <div>
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-xs font-semibold text-slate-300 uppercase tracking-wider">地块状态</h2>
          <span class="text-xs text-emerald-400">查看全部 (12)</span>
        </div>
        <div class="space-y-2.5">
          <div class="bg-slate-800/40 border border-slate-700/40 p-3 rounded-xl flex items-center justify-between">
            <div>
              <div class="text-xs font-medium text-slate-200">#01 号有机水稻地块</div>
              <div class="text-[10px] text-slate-400 mt-0.5">采收倒计时：14 天</div>
            </div>
            <span class="px-2 py-1 bg-emerald-500/10 text-emerald-400 text-[10px] rounded-md font-medium">生长良好</span>
          </div>
          <div class="bg-slate-800/40 border border-slate-700/40 p-3 rounded-xl flex items-center justify-between">
            <div>
              <div class="text-xs font-medium text-slate-200">#02 号大棚番茄区块</div>
              <div class="text-[10px] text-slate-400 mt-0.5">传感器实时测绘中</div>
            </div>
            <span class="px-2 py-1 bg-blue-500/10 text-blue-400 text-[10px] rounded-md font-medium">监控中</span>
          </div>
        </div>
      </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <div class="px-6 py-3 bg-slate-900/90 backdrop-blur border-t border-slate-800 flex justify-around items-center text-slate-400 text-xs">
      <div class="flex flex-col items-center text-emerald-400">
        <span class="text-base">🏠</span>
        <span class="text-[10px] mt-0.5">首页</span>
      </div>
      <div class="flex flex-col items-center">
        <span class="text-base">🗺️</span>
        <span class="text-[10px] mt-0.5">地图测绘</span>
      </div>
      <div class="flex flex-col items-center">
        <span class="text-base">🤖</span>
        <span class="text-[10px] mt-0.5">AI 助手</span>
      </div>
      <div class="flex flex-col items-center">
        <span class="text-base">⚙️</span>
        <span class="text-[10px] mt-0.5">设置</span>
      </div>
    </div>

  </div>

</body>
</html>
